{{- $url := .Get "url" -}}
{{- $name := .Get "name" -}}
{{- $icon := .Get "icon" | default (printf "%spwa-192x192.png" $url) -}}
<a href="{{ $url }}" title="{{ $name }}" style="display:flex; flex-direction:column; align-items:center; text-align:center; text-decoration:none; font-size:0.9em; line-height:1.2;">
  <img src="{{ $icon }}" alt="{{ $name }}" loading="lazy" style="width:96px; height:96px; border-radius:20%; margin:0 0 0.5em 0;">
  <span>{{ $name }}</span>
</a>
